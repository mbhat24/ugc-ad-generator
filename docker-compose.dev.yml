# Local development dependencies only (run api, worker and web on the host).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adreel
      POSTGRES_PASSWORD: adreel
      POSTGRES_DB: adreel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
