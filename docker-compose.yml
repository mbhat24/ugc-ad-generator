services:
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file: .env
    ports: ["3000:3000"]
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    env_file: .env
    restart: unless-stopped
    deploy:
      replicas: 1
